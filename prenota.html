<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prenota Taxi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">

<h1>Salento Taxi Guide</h1>

<p>Cooperativa Taxi Lecce</p>

</div>

</header>




<main>


<section class="hero">

<h2>
Prenota il tuo taxi
</h2>

<p>
Compila il modulo e invia la richiesta
alla Cooperativa Taxi Lecce.
</p>


</section>




<section class="card">


<form id="prenotazione">


<label>
Nome e Cognome
</label>

<input type="text" id="nome" required>




<label>
Numero di telefono
</label>

<input type="tel" id="telefono" required>




<label>
Partenza
</label>

<input type="text" id="partenza" required>




<label>
Destinazione
</label>

<input type="text" id="destinazione" required>




<label>
Data servizio
</label>

<input type="date" id="data" required>




<label>
Ora servizio
</label>

<input type="time" id="ora" required>




<label>
Numero passeggeri
</label>

<input type="number" id="passeggeri" min="1" required>




<label>
Bagagli
</label>

<input type="number" id="bagagli" min="0" value="0">




<button type="submit">
Invia richiesta
</button>


</form>


</section>


</main>




<footer>

<p>
Cooperativa Taxi Lecce
</p>

</footer>



<script src="script.js"></script>


</body>

</html>
