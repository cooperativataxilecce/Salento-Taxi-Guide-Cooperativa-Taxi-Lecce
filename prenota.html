<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prenota Taxi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">

<h1>Salento Taxi Guide</h1>

<p>Cooperativa Taxi Lecce</p>

</div>

</header>




<main>


<section class="hero">

<h2>
Prenota il tuo taxi
</h2>

<p>
Compila il modulo e invia la richiesta
alla Cooperativa Taxi Lecce.
</p>


</section>




<section class="card">


<form id="prenotazione">


<div class="input-group">

<label>
Nome e Cognome *
</label>

<input type="text" id="nome" required>

</div>



<div class="input-group">

<label>
Numero di telefono *
</label>

<input type="tel" id="telefono" required>

</div>




<div class="input-group">

<label>
Indirizzo di partenza *
</label>

<input type="text" id="partenza" required>

</div>




<div class="input-group">

<label>
Indirizzo di arrivo *
</label>

<input type="text" id="destinazione" required>

</div>





<div class="row">


<div class="input-group">

<label>
Data *
</label>

<input type="date" id="data" required>

</div>



<div class="input-group">

<label>
Orario *
</label>

<input type="time" id="ora" required>

</div>


</div>





<div class="input-group">

<label>
Numero passeggeri *
</label>

<input type="number" id="passeggeri" min="1" required>

</div>





<div class="input-group">

<label>
Note extra
</label>

<textarea 
id="note"
placeholder="Inserisci eventuali richieste particolari">
</textarea>

</div>





<div class="privacy-box">


<label>

<input type="checkbox" id="privacy" required>

Accetto il trattamento dei dati personali secondo
l'informativa privacy della Cooperativa Taxi Lecce.

</label>


</div>





<button class="main-button" type="submit">
Invia richiesta
</button>


</form>


</section>


</main>




<footer>

<p>
Cooperativa Taxi Lecce
</p>

</footer>



<script src="script.js"></script>


</body>

</html>
