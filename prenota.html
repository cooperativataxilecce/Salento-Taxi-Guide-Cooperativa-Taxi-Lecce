<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prenota Taxi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">

<h1>Salento Taxi Guide</h1>

<p>Cooperativa Taxi Lecce</p>

</div>

</header>




<main class="booking-container">


<section class="booking-card">


<div class="form-title">

<h2>
Prenota il tuo taxi
</h2>

<p>
Inserisci i dati della corsa
</p>

</div>





<form id="prenotazione">



<div class="input-box">



<input 
type="text"
id="nome"
placeholder="Nome e Cognome"
required>

</div>





<div class="input-box">



<input 
type="tel"
id="telefono"
placeholder="Numero di telefono"
required>

</div>





<div class="input-box">



<input 
type="text"
id="partenza"
placeholder="Indirizzo di partenza"
required>

</div>





<div class="input-box">



<input 
type="text"
id="destinazione"
placeholder="Indirizzo di arrivo"
required>

</div>





<div class="row-form">


<div class="input-box">



<input 
type="date"
id="data"
required>

</div>




<div class="input-box">



<input 
type="time"
id="ora"
required>

</div>


</div>





<div class="input-box">



<input 
type="number"
id="passeggeri"
placeholder="Numero passeggeri"
min="1"
required>

</div>





<div class="input-box">

<textarea
id="note"
placeholder="Note extra (facoltativo)">
</textarea>

</div>





<div class="privacy-card">


<label>

<input 
type="checkbox"
id="privacy"
required>


Accetto l'informativa privacy
della Cooperativa Taxi Lecce.


</label>


</div>





<div class="submit-button">


<button type="submit">

Invia richiesta

</button>


</div>




</form>


</section>


</main>




<footer>

<p>
Cooperativa Taxi Lecce
</p>

<p>
Veloce · Sicuro · Puntuale
</p>

</footer>




<script src="script.js"></script>


</body>

</html>
