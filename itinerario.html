<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crea il tuo itinerario</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="page-header">

<h1>
Crea il tuo itinerario
</h1>

<p>
Scopri il Salento in base alle tue preferenze
</p>

</div>

</header>



<main class="booking-container">


<section class="booking-card">


<h2>
Cosa vuoi scoprire del Salento?
</h2>


<div class="choice-group">

<button class="choice" data-type="mare">
Mare
</button>

<button class="choice" data-type="cultura">
Cultura
</button>

<button class="choice" data-type="borghi">
Borghi
</button>

<button class="choice" data-type="panorami">
Panorami
</button>

<button class="choice" data-type="natura">
Natura
</button>

<button class="choice" data-type="relax">
Relax
</button>

<button class="choice" data-type="enogastronomia">
Cucina tipica
</button>

<button class="choice" data-type="movida">
Vita serale
</button>

</div>

  <h2>
Con chi viaggi?
</h2>


<div class="choice-group">

<button class="choice" data-type="famiglia">
Famiglia
</button>

<button class="choice" data-type="coppia">
Coppia
</button>

<button class="choice" data-type="amici">
Amici
</button>

<button class="choice" data-type="solo">
Da solo
</button>

</div>

  <h2>
Quanti giorni vuoi dedicare al Salento?
</h2>


<div class="choice-group">

<button class="choice">
1 giorno
</button>

<button class="choice">
2 giorni
</button>

<button class="choice">
3 giorni
</button>

<button class="choice">
4 giorni
</button>

<button class="choice">
5 giorni
</button>

<button class="choice">
7 giorni
</button>

</div>




<button class="main-button">

Genera itinerario

</button>



</section>


</main>

<script src="localita.js"></script>
<script src="algoritmo.js"></script>
<script src="itinerario.js"></script>



</body>

</html>
