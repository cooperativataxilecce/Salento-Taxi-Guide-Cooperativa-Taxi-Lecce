<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crea il tuo itinerario</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="page-header">

<h1>
Crea il tuo itinerario
</h1>

<p>
Scopri il Salento in base alle tue preferenze
</p>

</div>

</header>



<main class="booking-container">


<section class="booking-card">


<h2>
Quanti giorni hai a disposizione?
</h2>


<div class="choice-group">


<button class="choice">
1 giorno
</button>


<button class="choice">
2 giorni
</button>


<button class="choice">
3 giorni
</button>


<button class="choice">
4-5 giorni
</button>


<button class="choice">
7 giorni
</button>


</div>



<h2>
Ti piace il mare?
</h2>

<div class="choice-group">

<button class="choice" data-type="mare">
Si
</button>

<button class="choice" data-type="mare">
No
</button>

</div>




<h2>
Vuoi visitare città e borghi storici?
</h2>


<div class="choice-group">

<button class="choice" data-type="borghi">
Si
</button>

<button class="choice" data-type="borghi">
No
</button>

</div>



<h2>
Ti interessano panorami sul mare?
</h2>

<div class="choice-group">

<button class="choice" data-type="panorami">
Si
</button>

<button class="choice" data-type="panorami">
No
</button>

</div>




<h2>
Vuoi scoprire la cucina e le tradizioni salentine?
</h2>


<div class="choice-group">

<button class="choice" data-type="tradizioni">
Si
</button>

<button class="choice" data-type="tradizioni">
No
</button>

</div>




<button class="main-button">

Genera itinerario

</button>



</section>


</main>



<script src="itinerario.js"></script>


</body>

</html>
